# Profile distribution manifest — lets this profile be installed on its own:
#   hermes profile install <path-or-git-url>/profiles/project-manager
# Recipients keep their own memories, sessions and API keys; only the agent
# definition travels. See the repo README.
name: project-manager
version: 1.0.0
description: >-
  Registry and task board keeper. Single writer of the board; records status, does not route.
# Credentials the recipient must supply (names only, never values). The installer
# renders these into .env.EXAMPLE from this list.
env_requires:
  - name: OPENROUTER_API_KEY
    description: "Model provider key (or swap the profile's model to another provider)."
